# Builds source tarball (Linux) and Windows binary, then publishes both to
# ak-finccam/r-packages as a drat-style CRAN repository.
#
# Prerequisites:
#   - Public GitHub repo ak-finccam/r-packages with GitHub Pages enabled
#     (Settings → Pages → Source: Deploy from a branch → main, /).
#   - Secret R_PACKAGES_PAT: a GitHub PAT with 'repo' write scope on
#     ak-finccam/r-packages, added to this repo's Actions secrets.

name: Build and publish R binaries

on:
  push:
    branches: [feature/bql-finccam]
  workflow_dispatch:

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install build dependencies
        run: install.packages(c("Rcpp", "BH", "simplermarkdown"))
        shell: Rscript {0}

      - name: Build source tarball
        run: R CMD build .

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: "*.tar.gz"

  build-windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install build dependencies
        run: install.packages(c("Rcpp", "BH", "simplermarkdown"))
        shell: Rscript {0}

      - name: Build and install as binary
        run: |
          R CMD build .
          R CMD INSTALL --build Rblpapi_*.tar.gz
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: "*.zip"

  publish:
    needs: [build-source, build-windows-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: ak-finccam/r-packages
          token: ${{ secrets.R_PACKAGES_PAT }}
          path: r-packages

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install drat
        run: install.packages("drat")
        shell: Rscript {0}

      - name: Publish with drat
        run: |
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] && Rscript -e "drat::insertPackage('$f', repodir='r-packages', commit=FALSE)"
          done
        shell: bash

      - name: Commit and push
        run: |
          cd r-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: publish Rblpapi binaries ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
