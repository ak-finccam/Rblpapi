# Builds source tarball, Linux binary (Ubuntu Noble), and Windows binary, then
# publishes all three to ak-finccam/r-packages as a drat-style CRAN repository.
# drat publishes the source tarball and the Windows binary. The Linux binary
# goes to bin/linux/noble/4.5/src/contrib, where renv looks for it.
#
# The workflow publishes each version only once. The nix setup of finccam-engine
# stores the hash of the source tarball, so a rebuilt tarball breaks it. To
# publish a change, raise the version in DESCRIPTION.
#
# Prerequisites:
#   - Public GitHub repo ak-finccam/r-packages with GitHub Pages enabled
#     (Settings → Pages → Source: Deploy from a branch → main, /).
#   - Secret R_PACKAGES_PAT: a GitHub PAT with 'repo' write scope on
#     ak-finccam/r-packages, added to this repo's Actions secrets.

name: Build and publish R binaries

on:
  push:
    branches: [feature/bql-finccam]
  workflow_dispatch:

# A second run waits for the first, so that it sees the version the first run
# published.
concurrency: publish

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      # The clone holds only the file tree, so it downloads no tarball.
      - name: Check if this version is already published
        id: check
        run: |
          version=$(sed -n 's/^Version: //p' DESCRIPTION)
          git clone --quiet --depth 1 --filter=blob:none --no-checkout \
            https://github.com/ak-finccam/r-packages.git r-packages
          if [ -n "$(git -C r-packages ls-tree --name-only HEAD "src/contrib/Rblpapi_$version.tar.gz")" ]; then
            echo "::warning::Rblpapi $version is already published. Raise the version in DESCRIPTION to publish this commit."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build-source:
    needs: check-version
    if: needs.check-version.outputs.published == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install build dependencies
        run: install.packages(c("Rcpp", "BH", "simplermarkdown"))
        shell: Rscript {0}

      - name: Build source tarball
        run: R CMD build .

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: "*.tar.gz"

  build-linux-binary:
    # The publish job puts this binary in bin/linux/noble/4.5. If you change the
    # runner or the R minor version, the binary needs its own folder.
    needs: check-version
    if: needs.check-version.outputs.published == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install build dependencies
        run: install.packages(c("Rcpp", "BH", "simplermarkdown"))
        shell: Rscript {0}

      - name: Build source tarball and install as binary
        run: |
          R CMD build .
          R CMD INSTALL --build Rblpapi_*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          # R CMD INSTALL --build on Linux produces a binary .tar.gz
          # (distinct from the source tarball — it contains compiled .so files)
          path: "*_R_x86_64-pc-linux-gnu.tar.gz"
          if-no-files-found: error

  build-windows-binary:
    needs: check-version
    if: needs.check-version.outputs.published == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install build dependencies
        run: install.packages(c("Rcpp", "BH", "simplermarkdown"))
        shell: Rscript {0}

      - name: Build and install as binary
        run: |
          R CMD build .
          R CMD INSTALL --build Rblpapi_*.tar.gz
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: "*.zip"

  publish:
    needs: [build-source, build-linux-binary, build-windows-binary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/checkout@v4
        with:
          repository: ak-finccam/r-packages
          token: ${{ secrets.R_PACKAGES_PAT }}
          path: r-packages

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install drat
        run: install.packages("drat")
        shell: Rscript {0}

      - name: Publish source tarball and Windows binary with drat
        run: |
          for f in artifacts/source/*.tar.gz artifacts/windows-binary/*.zip; do
            Rscript -e "drat::insertPackage('$f', repodir='r-packages', commit=FALSE)"
          done
        shell: bash

      # drat would treat the Linux binary as a source package and put it in
      # src/contrib, where renv never looks. renv reads Linux binaries from
      # bin/linux/<distribution>/<R minor version>/src/contrib, named like
      # source packages.
      - name: Publish Linux binary
        run: |
          shopt -s nullglob
          binaries=(artifacts/linux-binary/*_R_x86_64-pc-linux-gnu.tar.gz)
          if [ "${#binaries[@]}" -ne 1 ]; then
            echo "::error::Expected one Linux binary, found ${#binaries[@]}"
            exit 1
          fi
          binary="${binaries[0]}"

          description=$(tar -xzOf "$binary" Rblpapi/DESCRIPTION)
          if ! grep -q '^Built: ' <<< "$description"; then
            echo "::error::$binary has no Built field in its DESCRIPTION"
            exit 1
          fi

          contrib=r-packages/bin/linux/noble/4.5/src/contrib
          mkdir -p "$contrib"
          cp "$binary" "$contrib/$(basename "$binary" _R_x86_64-pc-linux-gnu.tar.gz).tar.gz"
          Rscript -e 'tools::write_PACKAGES("'"$contrib"'", type = "source", latestOnly = FALSE, addFiles = TRUE, fields = "Built")'
        shell: bash

      - name: Commit and push
        run: |
          cd r-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: publish Rblpapi binaries ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
